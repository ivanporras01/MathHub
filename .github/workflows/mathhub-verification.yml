name: MathHub verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm run typecheck:cloudflare
      - name: Verify 75-topic learning pathway
        run: node scripts/verify-learning-path.mjs
      - name: Render lessons and verify new mathematical models
        run: |
          node scripts/verify-learning.mjs
          node scripts/verify-advanced-math.mjs
      - name: Verify scoring and classroom persistence
        run: node scripts/verify-cloudflare.mjs
      - name: Production build
        run: pnpm run build:cloudflare
